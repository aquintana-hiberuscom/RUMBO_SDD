<section class="register-page" aria-labelledby="register-title">
  <div class="register-card">
    <h1 id="register-title">Crea tu cuenta en RUMBO</h1>
    <p class="subtitle">Empieza tu camino hacia la educación financiera</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <!-- Email -->
      <div class="field" [class.field--error]="isFieldInvalid('email')">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('email')"
          [attr.aria-describedby]="isFieldInvalid('email') ? 'email-error' : null"
        />
        <span *ngIf="isFieldInvalid('email')" id="email-error" class="field__error" role="alert">
          {{ getFieldError('email') }}
        </span>
      </div>

      <!-- Nombre -->
      <div class="field" [class.field--error]="isFieldInvalid('nombre')">
        <label for="nombre">Nombre</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          autocomplete="given-name"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('nombre')"
          [attr.aria-describedby]="isFieldInvalid('nombre') ? 'nombre-error' : null"
        />
        <span *ngIf="isFieldInvalid('nombre')" id="nombre-error" class="field__error" role="alert">
          {{ getFieldError('nombre') }}
        </span>
      </div>

      <!-- Apellidos -->
      <div class="field" [class.field--error]="isFieldInvalid('apellidos')">
        <label for="apellidos">Apellidos</label>
        <input
          id="apellidos"
          type="text"
          formControlName="apellidos"
          autocomplete="family-name"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('apellidos')"
          [attr.aria-describedby]="isFieldInvalid('apellidos') ? 'apellidos-error' : null"
        />
        <span *ngIf="isFieldInvalid('apellidos')" id="apellidos-error" class="field__error" role="alert">
          {{ getFieldError('apellidos') }}
        </span>
      </div>

      <!-- Edad -->
      <div class="field" [class.field--error]="isFieldInvalid('edad')">
        <label for="edad">Edad</label>
        <input
          id="edad"
          type="number"
          formControlName="edad"
          min="1"
          max="120"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('edad')"
          [attr.aria-describedby]="isFieldInvalid('edad') ? 'edad-error' : null"
        />
        <span *ngIf="isFieldInvalid('edad')" id="edad-error" class="field__error" role="alert">
          {{ getFieldError('edad') }}
        </span>
      </div>

      <!-- Contraseña -->
      <div class="field" [class.field--error]="isFieldInvalid('password')">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          aria-required="true"
          [attr.aria-invalid]="isFieldInvalid('password')"
          [attr.aria-describedby]="isFieldInvalid('password') ? 'password-error' : null"
        />
        <span *ngIf="isFieldInvalid('password')" id="password-error" class="field__error" role="alert">
          {{ getFieldError('password') }}
        </span>
      </div>

      <!-- Error de servidor -->
      <div *ngIf="serverError" class="server-error" role="alert">
        {{ serverError }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Registrando...' : 'Crear cuenta' }}
      </button>

    </form>

    <p class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</section>
