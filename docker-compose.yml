version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rumbo_postgres
    environment:
      POSTGRES_USER: rumbo_user
      POSTGRES_PASSWORD: rumbo_password
      POSTGRES_DB: rumbo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rumbo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumbo_user -d rumbo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rumbo_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rumbo_db
      SPRING_DATASOURCE_USERNAME: rumbo_user
      SPRING_DATASOURCE_PASSWORD: rumbo_password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rumbo_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rumbo_frontend
    environment:
      - NG_APP_API_URL=http://localhost:8080/api/v1
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/node_modules:/app/node_modules
    networks:
      - rumbo_network
    command: npm start

volumes:
  postgres_data:

networks:
  rumbo_network:
    driver: bridge
