databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: rumbo
      comment: "Crea la tabla users para almacenar los usuarios registrados"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_users_email
              - column:
                  name: nombre
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: apellidos
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: edad
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
