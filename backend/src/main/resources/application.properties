spring.application.name=rumbo-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/rumbo_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=rumbo_user
spring.datasource.password=rumbo_password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# JWT — cambiar el secret por uno seguro (min 32 chars) en producción
rumbo.jwt.secret=rumbo-secret-key-change-in-production-min-32chars
rumbo.jwt.expiration-ms=86400000
