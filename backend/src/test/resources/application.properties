# Configuración de test — usa H2 en memoria para que los tests no dependan de PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Liquibase desactivado en tests — H2 crea el esquema con ddl-auto
spring.liquibase.enabled=false

rumbo.jwt.secret=test-secret-key-only-for-tests-min-32chars
rumbo.jwt.expiration-ms=3600000
